[project]
name = "powersignal-ingestion"
version = "0.1.0"
description = "Public energy data ingestion pipeline for PowerSignal (SMP, DR, weather, fuel cost)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "pandas>=2.2.0",
    "openpyxl>=3.1.2",
    "tenacity>=8.2.3",
    "structlog>=24.1.0",
    "click>=8.1.7",
    "chardet>=5.2.0",
    "xmltodict>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
]

[project.scripts]
ps-daily = "src.cli.run_daily:main"
ps-monthly = "src.cli.run_monthly:main"
ps-dr-ingest = "src.cli.run_dr_ingest:main"
ps-init-db = "src.cli.init_db:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "W", "UP"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]
